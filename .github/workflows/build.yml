name: build

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MAVEN_REPOSITORY: '/home/maven'
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOSTURL: ${{ vars.SONAR_HOSTURL }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    container:
      image: ${{ vars.CONTAINER_IMAGE }}
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Branch name
        run: echo running on branch ${GITHUB_REF##*/}

      - name: Setup runtime env vars
        run: |
          echo "MAVEN_SETTINGS=$(pwd)/settings.xml" >> $GITHUB_ENV

      - name: Cache maven packages
        uses: actions/cache@v6
        with:
          path: $MAVEN_REPOSITORY
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Checkout badges branch dedicated to storing badges only
        uses: actions/checkout@v7
        with:
          ref: badges
          path: badges

      - name: Build
        run: |
          mvn --settings $MAVEN_SETTINGS \
              -Dmaven.repo.local=$MAVEN_REPOSITORY \
              -DskipTests \
            clean compile

      - name: Verify
        run: |
          mvn --settings $MAVEN_SETTINGS \
              -Dmaven.repo.local=$MAVEN_REPOSITORY \
            verify      

      - name: Perform quality check
        timeout-minutes: 60
        run: |
          mvn --settings $MAVEN_SETTINGS \
              -Dmaven.repo.local=$MAVEN_REPOSITORY  \
              -Dsonar.qualitygate.wait=true \
             sonar:sonar