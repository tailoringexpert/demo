name: changelog

on:
  workflow_dispatch:

jobs:
  create-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get raw version
        id: pom_version
        uses: NicolasBonnin/maven-get-version-action@2b4a1032d4406603c98e3d8a2c4fa1289b59b6dd

      - name: Release version
        id: release_version
        run: |
          RAW_VERSION=${{ steps.pom_version.outputs.version }}
    
          RELEASE_VERSION=${RAW_VERSION%-SNAPSHOT}
          RELEASE_VERSION=${RELEASE_VERSION%-snapshot}
    
          echo "Release Version: $RELEASE_VERSION"
    
          echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT     

      - name: Create tag
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ steps.release_version.outputs.version }}',
              sha: context.sha
            })

      - name: Generate changelog
        id: generate_changelog
        uses: janheinrichmerker/action-github-changelog-generator@e60b5a2bd9fcd88dadf6345ff8327863fb8b490f
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filterByMilestone: true
          pullRequests: false
          prWoLabels: false
          unreleased: false
          dateFormat: "%m.%d.%Y"
          excludeLabels: "duplicate,question,invalid,wontfix,weekly-digest,dependencies"
          output: "CHANGELOG.md"

      - name: Commit and push changelog
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if [[ `git status --porcelain CHANGELOG.md` ]]; then
            git config --global user.name 'github-actions'
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add CHANGELOG.md
            git commit -m "Autogenerated Changelog" CHANGELOG.md
            git push
          fi

      - name: Delete tag
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'tags/v${{ steps.release_version.outputs.version }}',
              sha: context.sha
            })
